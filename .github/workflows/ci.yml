name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true

  # ci-node.yml exposes no outputs, so this copies its tier rule for the jobs
  # declared here: a draft and the next to main pull request run none of them,
  # and only the nightly adds the Windows legs.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      tests: ${{ steps.tier.outputs.tests }}
      os: ${{ steps.tier.outputs.os }}
    steps:
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          case "$EVENT" in
            pull_request)
              if [[ "$BASE_REF" == "$DEFAULT_BRANCH" && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$HEAD_REF" =~ ^(next|develop)$ ]]; then
                tier=none
              elif [[ "$DRAFT" == true ]]; then
                tier=draft
              elif [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
                tier=full
              else
                tier=fast
              fi
              ;;
            push)
              if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then tier=none; else tier=full; fi
              ;;
            schedule) tier=nightly ;;
            *) tier=full ;;
          esac

          tests=true
          if [[ "$tier" == none || "$tier" == draft ]]; then
            tests=false
          fi

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          {
            echo "tier=${tier}"
            echo "tests=${tests}"
            echo "os=${os}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`: tests ${tests} on ${os}" >> "$GITHUB_STEP_SUMMARY"

  vitest:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        package: [sidecar, frontend-vue]
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./${{ matrix.package }}" --frozen-lockfile
      - run: pnpm --dir ${{ matrix.package }} run test

  # `ajs dms verify-source`: the production build of the DMS core layer with
  # this one, the assistant and the builder, then vue-tsc.
  frontend-verify:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./frontend-vue" --frozen-lockfile
      - run: pnpm --dir frontend-vue run verify-source

  # Packs the module, installs the tarball as the AntelopeJS module cache
  # does, starts the installed sidecar and checks every import resolves.
  installed-module:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./sidecar" --frozen-lockfile
      - run: pnpm run test:installed

  # The verify skill's journeys as a Playwright suite: the @smoke set on the
  # full tier, every journey on the nightly tier. Raise the shard count when
  # one shard passes about 30 minutes.
  e2e:
    needs: select
    if: needs.select.outputs.tier == 'full' || needs.select.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      TIER: ${{ needs.select.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "DMS_CONTROL_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/playground/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            e2e/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground/pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dms-control/frontend
          key: dms-control-frontend-${{ github.sha }}
          restore-keys: dms-control-frontend-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.TIER == 'full'
        run: pnpm e2e --grep @smoke
      - if: env.TIER == 'nightly'
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      # The journeys that only the development dashboard serves.
      - if: (success() || failure()) && env.TIER == 'nightly'
        run: pnpm e2e:dev --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report-dev
      - if: always() && env.TIER == 'nightly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: always() && env.TIER == 'nightly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-dev-${{ matrix.shard }}
          path: e2e/blob-report-dev
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report*
            e2e/test-results*
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the nightly shards.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --filter "{.}" --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-artifacts
      # Each artifact keeps its folder, so the blobs of the two configs never share a name.
      - run: |
          mkdir -p e2e/blob-reports
          for blob in e2e/blob-artifacts/*/*.zip; do
            cp "$blob" "e2e/blob-reports/$(basename "$(dirname "$blob")")-$(basename "$blob")"
          done
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # A job the tier skipped does not fail it. A draft pull request fails it, so
  # merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, vitest, frontend-verify, installed-module, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.tests == 'true' && (needs.vitest.result == 'skipped' || needs.frontend-verify.result == 'skipped' || needs.installed-module.result == 'skipped')) || ((needs.select.outputs.tier == 'full' || needs.select.outputs.tier == 'nightly') && needs.e2e.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
