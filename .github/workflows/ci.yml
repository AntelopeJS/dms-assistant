name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true
      single-job: false

  # ci-node.yml exposes no outputs, so this takes the shared tier rule and
  # derives the jobs declared here from it: a draft and the next to main pull
  # request run none of them, and only the nightly adds the Windows legs. The
  # browser journeys run their @smoke set on every pull request that runs
  # tests, the fast tier's included, and every journey in shards in the merge
  # queue, on a manual run and nightly.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      tests: ${{ steps.tier.outputs.tests }}
      os: ${{ steps.tier.outputs.os }}
      e2e: ${{ steps.tier.outputs.e2e }}
      shards: ${{ steps.tier.outputs.shards }}
    steps:
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2

      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          TIER: ${{ steps.pick.outputs.tier }}
          EVENT: ${{ github.event_name }}
        run: |
          tier="$TIER"

          tests=true
          if [[ "$tier" == none || "$tier" == draft ]]; then
            tests=false
          fi

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          e2e=smoke
          shards='[1]'
          if [[ "$tests" == false ]]; then
            e2e=none
          elif [[ "$tier" == queue || "$tier" == nightly || "$EVENT" == merge_group || "$EVENT" == workflow_dispatch ]]; then
            e2e=all
            shards='[1,2]'
          fi

          {
            echo "tier=${tier}"
            echo "tests=${tests}"
            echo "os=${os}"
            echo "e2e=${e2e}"
            echo "shards=${shards}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`: tests ${tests} on ${os}, browser journeys ${e2e}" >> "$GITHUB_STEP_SUMMARY"

  vitest:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        package: [sidecar, frontend-vue]
    defaults:
      run:
        shell: bash
    steps:
      - name: Use LF line endings, symlinks and Git Bash for package scripts
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash_path=$(cygpath -w /usr/bin/bash)
          echo "npm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
          echo "pnpm_config_script_shell=${bash_path}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./${{ matrix.package }}" --frozen-lockfile
      - run: pnpm --dir ${{ matrix.package }} run test

  # `ajs dms verify-source`: the production build of the DMS core layer with
  # this one, the assistant and the builder, then vue-tsc.
  frontend-verify:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./frontend-vue" --frozen-lockfile
      - run: pnpm --dir frontend-vue run verify-source

  # Packs the module, installs the tarball as the AntelopeJS module cache
  # does, starts the installed sidecar and checks every import resolves.
  installed-module:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sidecar/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./sidecar" --frozen-lockfile
      - run: pnpm run test:installed

  # Both journeys suites as Playwright suites: e2e/ for the
  # assistant, e2e/builder/ for the builder, and the assistant's
  # development-dashboard journeys after them. `pnpm e2e:build` builds the
  # module and both playgrounds once, then each suite's global setup starts
  # its own run. Raise the shard count in
  # `select` when one shard passes about 30 minutes.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      E2E: ${{ needs.select.outputs.e2e }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/playground/pnpm-lock.yaml
            e2e/builder/playground/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            e2e/playground/.antelope/cache
            e2e/builder/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground/pnpm-lock.yaml', 'e2e/playground/antelope.config.ts', 'e2e/builder/playground/pnpm-lock.yaml', 'e2e/builder/playground/antelope.config.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: dms-e2e-frontend-${{ github.sha }}
          restore-keys: dms-e2e-frontend-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e:build
      - run: echo "DMS_E2E_PREBUILT=1" >> "$GITHUB_ENV"
      - if: env.E2E == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: (success() || failure()) && env.E2E == 'smoke'
        run: pnpm e2e:builder --grep @smoke
      - if: env.E2E == 'all'
        run: pnpm e2e --shard="$SHARD" --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      - if: (success() || failure()) && env.E2E == 'all'
        run: pnpm e2e:builder --shard="$SHARD" --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report-builder
      # The journeys that only the development dashboard serves.
      - if: (success() || failure()) && env.E2E == 'all'
        run: pnpm e2e:dev --shard="$SHARD" --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report-dev
      - if: always() && env.E2E == 'all'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: always() && env.E2E == 'all'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-builder-${{ matrix.shard }}
          path: e2e/blob-report-builder
          retention-days: 3
      - if: always() && env.E2E == 'all'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-dev-${{ matrix.shard }}
          path: e2e/blob-report-dev
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/**/playwright-report*
            e2e/**/test-results*
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # The journeys that open no tab, as node:test files on one run per journeys
  # suite: in the merge queue, on a manual run and nightly.
  integration:
    needs: select
    if: needs.select.outputs.e2e == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/playground/pnpm-lock.yaml
            e2e/builder/playground/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            e2e/playground/.antelope/cache
            e2e/builder/playground/.antelope/cache
          key: integration-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground/pnpm-lock.yaml', 'e2e/playground/antelope.config.ts', 'e2e/builder/playground/pnpm-lock.yaml', 'e2e/builder/playground/antelope.config.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: dms-e2e-frontend-${{ github.sha }}
          restore-keys: dms-e2e-frontend-
      - run: pnpm e2e:build
      - run: pnpm test:integration
        env:
          DMS_E2E_PREBUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-evidence
          path: |
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards of each suite.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --filter "{.}" --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-artifacts
      # Each artifact keeps its folder, so the blobs of the suites never share a
      # name. Playwright merges only blobs of one config folder, so the
      # builder's suite gets its own report.
      - run: |
          mkdir -p e2e/blob-reports e2e/builder/blob-reports
          for blob in e2e/blob-artifacts/*/*.zip; do
            artifact=$(basename "$(dirname "$blob")")
            target=e2e/blob-reports
            if [[ "$artifact" == blob-report-builder-* ]]; then
              target=e2e/builder/blob-reports
            fi
            cp "$blob" "${target}/${artifact}-$(basename "$blob")"
          done
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/builder/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/builder/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/builder/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-builder
          path: e2e/builder/playwright-report
          retention-days: 14

  # The repo-level verdict: it fails when the `ci` call or a job declared here
  # failed or was cancelled, `integration` included, so a red merge queue run
  # keeps the pull request out of main. A job the tier skipped does not fail
  # it. A draft pull request fails it, so merge-when-green cannot merge on the
  # draft run.
  verdict:
    if: always()
    needs:
      - select
      - ci
      - vitest
      - frontend-verify
      - installed-module
      - e2e
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.tests == 'true' && (needs.vitest.result == 'skipped' || needs.frontend-verify.result == 'skipped' || needs.installed-module.result == 'skipped')) || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped') || (needs.select.outputs.e2e == 'all' && needs.integration.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
