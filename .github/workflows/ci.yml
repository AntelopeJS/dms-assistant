name: ci

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sidecar
            script: test
          - package: frontend-vue
            script: test
          - package: frontend-vue
            script: test:components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./${{ matrix.package }}" --frozen-lockfile
      - run: pnpm --dir ${{ matrix.package }} run ${{ matrix.script }}

  # `ajs dms verify-source`: the production build of the DMS core layer with
  # this one, the assistant and the builder, then vue-tsc.
  frontend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend-vue/pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --filter "./frontend-vue" --frozen-lockfile
      - run: pnpm --dir frontend-vue run verify-source

  # The builder engine specs write ts-morph fixtures to disk and take minutes.
  # Each shard runs its files with `mocha --parallel` (`.mocharc.json`). One
  # rule per shard but the last, which takes every file no rule matches, so a
  # new spec always runs; the rules group the files by their measured duration.
  engine-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHARD_RULES: |
        ^(map-resources(-(display|display-defaults|page-options|page-options-mapped))?|module-reload|page-access)\.
        ^(map-resources-(forgiving|remap)\.|table-)
        ^(draft-queries|map-resources-(approval|declared-relations|display-defaults-null|label-defaults-kept)|mapped-table-reads)\.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --filter "{.}" --frozen-lockfile
      - run: pnpm run build
      - env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          files=$(cd dist/builder/test && ls *.spec.js | sort | awk -v shard="$SHARD" -v total="$TOTAL" '
            BEGIN {
              n = split(ENVIRON["SHARD_RULES"], rule, "\n")
              if (rule[n] == "") n--
              if (n != total - 1) { print "SHARD_RULES has " n " rules for " total " shards" > "/dev/stderr"; exit 1 }
            }
            {
              owner = total
              for (i = 1; i <= n; i++) if ($0 ~ rule[i]) { owner = i; break }
              if (owner == shard) print "dist/builder/test/" $0
            }')
          test -n "$files" || { echo "shard $SHARD runs no spec file" >&2; exit 1; }
          mapfile -t list <<< "$files"
          pnpm exec mocha "${list[@]}"

  ubuntu:
    if: always()
    needs: [ci, vitest, frontend-verify, engine-specs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
